services:
  - type: web
    name: personalwebsite-backend
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: GENSHIN_DB_SECRET
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://valakyr159.github.io
      - key: MAX_PDF_SIZE_MB
        value: "20"
